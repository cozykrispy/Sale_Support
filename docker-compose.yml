services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-support-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/sales_support.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-fusion-advantec-super-secret-jwt-key-2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-google/gemini-2.0-flash-exp:free}
    volumes:
      - backend_data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - sales_hub_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: sales-support-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sales_hub_net

volumes:
  backend_data:

networks:
  sales_hub_net:
    driver: bridge
