name: DevSecOps CI/CD Pipeline (Test + SCA + SAST + IaC + DAST)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  # ====================================================================
  # 1. Backend Unit Tests + SAST (Bandit) + SCA (pip-audit)
  # ====================================================================
  backend-test-and-security:
    name: Backend Unit Test, SAST & Python SCA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Backend Unit Tests (pytest)
        run: pytest -v

      - name: Run SAST Scan (Bandit - Python Static Analysis)
        run: bandit -r app -ll

      - name: Run SCA Scan (pip-audit - Python Dependency Vulnerabilities)
        run: pip-audit -r requirements.txt || true

  # ====================================================================
  # 2. Multi-Language SAST (Semgrep) + Filesystem SCA & IaC (Trivy)
  # ====================================================================
  sast-sca-iac-scans:
    name: SAST (Semgrep), SCA & IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SAST with Semgrep (Python + TypeScript/Next.js)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
            p/owasp-top-ten
        env:
          SEMGREP_TIMEOUT: 300

      - name: Run SCA Filesystem Scan with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Run IaC Security Scan with Trivy (Dockerfile & docker-compose.yml)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

  # ====================================================================
  # 3. Docker Single-Command Deploy + E2E (Playwright) + DAST (OWASP ZAP)
  # ====================================================================
  docker-e2e-and-dast:
    name: Docker Build, Playwright E2E & OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: [backend-test-and-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start stack with single Docker Compose command
        run: |
          docker compose up -d --build
          echo "Waiting for Backend and Frontend containers to become healthy..."
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/health > /dev/null && curl -sSf http://localhost:3000/login > /dev/null; then
              echo "Both services are up and healthy!"
              break
            fi
            sleep 3
          done

      - name: Set up Node.js for Playwright E2E Tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Playwright Chromium
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Run Frontend E2E Tests (Playwright)
        working-directory: ./frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Run DAST Scan (OWASP ZAP Baseline against Backend & Frontend)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a -j"
          fail_action: false

      - name: Tear down Docker containers
        if: always()
        run: docker compose down -v
